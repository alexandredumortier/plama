<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Génère un calendrier ICS des plages de travail à la marée">
  <meta name="theme-color" content="#1a6ea8">
  <title>Plama – Planning marée</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    /* ── Variables couleur – light / dark ─────────────────────────────── */
    :root {
      --bg:             #eef3f9;
      --card:           #ffffff;
      --text:           #18293d;
      --text-muted:     #4a6880;
      --accent:         #1a6ea8;
      --accent-hover:   #155d96;
      --border:         #c2d4e6;
      --input-bg:       #ffffff;
      --radio-sel-bg:   #1a6ea8;
      --radio-sel-text: #ffffff;
      --err-bg:         #fff4f4;
      --err-text:       #b32727;
      --err-border:     #e05252;
      --ok-bg:          #f2fff4;
      --ok-text:        #1e7d3a;
      --ok-border:      #48c067;
      --shadow:         0 2px 16px rgba(26,110,168,.10);
      --creneau-bg:     rgba(26,110,168,.20);
      --creneau-border: #1a6ea8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:             #0c1826;
        --card:           #162333;
        --text:           #ddeaf8;
        --text-muted:     #7aa4c0;
        --accent:         #3b8fd4;
        --accent-hover:   #5aaae8;
        --border:         #243a52;
        --input-bg:       #0c1826;
        --radio-sel-bg:   #3b8fd4;
        --radio-sel-text: #ffffff;
        --err-bg:         #2a1010;
        --err-text:       #ff8080;
        --err-border:     #b83030;
        --ok-bg:          #0e2314;
        --ok-text:        #68e085;
        --ok-border:      #2d8c50;
        --shadow:         0 2px 16px rgba(0,0,0,.40);
        --creneau-bg:     rgba(59,143,212,.18);
        --creneau-border: #3b8fd4;
      }
    }

    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0.75rem 1rem 2rem;
    }

    /* ── En-tête ──────────────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 1.5rem 0 1.2rem;
    }
    .logo {
      width: 52px; height: 52px;
      margin: 0 auto 0.6rem;
      display: block;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -.5px;
    }
    h1 .sub {
      display: block;
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0;
      margin-top: 0.1rem;
    }

    /* ── Carte formulaire ─────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 1.6rem 1.4rem;
      max-width: 440px;
      margin: 0 auto;
    }

    /* ── Champs ───────────────────────────────────────────────────────── */
    .field { margin-bottom: 1.2rem; }

    label.lbl {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .03em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    select,
    input[type="date"],
    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color .15s;
    }
    select:focus,
    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Dates côte à côte */
    .row { display: flex; gap: 0.75rem; }
    .row .field { flex: 1; min-width: 0; }

    /* ── Radio mode haute / basse ─────────────────────────────────────── */
    .modes { display: flex; gap: 0.75rem; }
    .mode-btn { flex: 1; }
    .mode-btn input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .mode-btn label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.6rem 0.4rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: border-color .15s, background .15s, color .15s;
      user-select: none;
    }
    .mode-btn input:checked + label {
      border-color: var(--radio-sel-bg);
      background: var(--radio-sel-bg);
      color: var(--radio-sel-text);
    }

    /* ── Bouton principal ─────────────────────────────────────────────── */
    .btn-submit {
      display: block;
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.6rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .01em;
      transition: background .15s, opacity .1s;
    }
    .btn-submit:hover  { background: var(--accent-hover); }
    .btn-submit:active { opacity: .82; }

    /* ── Message statut ───────────────────────────────────────────────── */
    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      display: none;
    }
    .status-msg.error   { display: block; background: var(--err-bg);  color: var(--err-text);  border: 1px solid var(--err-border); }
    .status-msg.success { display: block; background: var(--ok-bg);   color: var(--ok-text);   border: 1px solid var(--ok-border); }

    /* ── Pied de page ─────────────────────────────────────────────────── */
    footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* ── Carte des ports ────────────────────────────────────────────────── */
    .map-ports {
      height: 40vh;
      max-width: 440px;
      margin: 0 auto 1rem;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #c8e0f0;
    }
    @media (prefers-color-scheme: dark) {
      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: #1e2e3e;
        color: #ddeaf8;
      }
    }

    /* ══════════════════════════════════════════════════════════════════
       Bandeau mise à jour
    ══════════════════════════════════════════════════════════════════ */
    #bandeau-maj {
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .01em;
      user-select: none;
    }
    #bandeau-maj:active { opacity: .85; }

    /* ══════════════════════════════════════════════════════════════════
       Gestion des écrans
    ══════════════════════════════════════════════════════════════════ */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Bouton retour ──────────────────────────────────────────────── */
    .btn-retour {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.3rem 0;
      margin-bottom: 0.6rem;
    }
    .btn-retour:active { opacity: .7; }

    /* ══════════════════════════════════════════════════════════════════
       Écran Accueil
    ══════════════════════════════════════════════════════════════════ */
    .accueil-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }
    .accueil-desc {
      font-size: 0.93rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 0.25rem;
    }
    .btn-accueil {
      display: block;
      width: 100%;
      padding: 1.1rem 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      line-height: 1.3;
    }
    .btn-accueil:hover  { border-color: var(--accent); }
    .btn-accueil:active { opacity: .82; }
    .btn-accueil.btn-accent {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .btn-accueil.btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-accueil .btn-sub {
      display: block;
      font-size: 0.78rem;
      font-weight: 400;
      margin-top: 0.2rem;
      opacity: .8;
    }

    /* ══════════════════════════════════════════════════════════════════
       Frise de consultation
    ══════════════════════════════════════════════════════════════════ */

    /* Écran frise : position fixe plein écran */
    #screen-frise.active {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      overflow: hidden;
    }

    /* Barre supérieure de la frise */
    #frise-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.6rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #btn-retour-frise {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0.2rem 0.3rem;
      line-height: 1;
    }
    #btn-retour-frise:active { opacity: .7; }
    #frise-info {
      flex: 1;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Zone principale : flèches + grille */
    #frise-outer {
      flex: 1;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      min-height: 0;
    }
    .frise-nav-btn {
      width: 26px;
      flex-shrink: 0;
      background: var(--card);
      border: none;
      border-right: 1px solid var(--border);
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .1s;
      user-select: none;
    }
    #btn-frise-next { border-right: none; border-left: 1px solid var(--border); }
    .frise-nav-btn:active { background: var(--border); }

    #frise-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    #frise-grille {
      width: 100%;
    }

    /* En-tête des colonnes (sticky dans le scroll) */
    .frise-header-row {
      display: flex;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card);
      border-bottom: 1.5px solid var(--border);
    }
    .frise-col-time-head {
      width: 26px;
      flex-shrink: 0;
    }
    .frise-col-header {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2px 1px;
      border-left: 1px solid var(--border);
      min-width: 0;
    }
    .frise-dow  {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .frise-date {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Corps : axe temps + colonnes de jours */
    .frise-body {
      display: flex;
      position: relative;
    }
    .frise-time-axis {
      width: 26px;
      flex-shrink: 0;
      position: relative;
      height: 1344px; /* 24h × 56px */
      border-right: 1.5px solid var(--border);
      background: var(--card);
    }
    .frise-hour-label {
      position: absolute;
      left: 0;
      right: 2px;
      text-align: right;
      font-size: 0.58rem;
      color: var(--text-muted);
      line-height: 1;
      transform: translateY(-50%);
      white-space: nowrap;
    }
    .frise-day-col {
      flex: 1;
      position: relative;
      border-left: 1px solid var(--border);
      height: 1344px; /* 24h × 56px */
      /* Lignes d'heures toutes les 56px (1h) */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 55px,
        var(--border) 55px,
        var(--border) 56px
      );
      min-width: 0;
    }

    /* Créneaux de travail */
    .frise-creneau {
      position: absolute;
      left: 1px;
      right: 1px;
      background: var(--creneau-bg);
      border: 1.5px solid var(--creneau-border);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1px 2px;
      min-height: 3px;
    }
    .fc-start,
    .fc-end {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
      display: block;
      white-space: nowrap;
    }
    .fc-end { text-align: right; margin-top: auto; }

    /* Étiquettes PM/BM (toutes, dans et hors créneaux) */
    .frise-pmbm-lbl {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.52rem;
      line-height: 1.25;
      padding: 1px 1px;
      border-radius: 2px;
      z-index: 2;
      pointer-events: none;
    }
    .fpl-pm { color: #1e7d3a; background: rgba(255,255,255,.75); }
    .fpl-bm { color: #b32727; background: rgba(255,255,255,.75); }
    @media (prefers-color-scheme: dark) {
      .fpl-pm { color: #68e085; background: rgba(0,0,0,.55); }
      .fpl-bm { color: #ff8080; background: rgba(0,0,0,.55); }
    }
  </style>
  <!-- Leaflet 1.9.4 embarqué -->
  <link rel="stylesheet" href="js/lib/leaflet.css">
</head>
<body>

  <!-- ── Bandeau mise à jour (masqué par défaut) ──────────────────────── -->
  <div id="bandeau-maj" hidden>
    Nouvelle version disponible — toucher pour recharger
  </div>

  <!-- ── En-tête commun ───────────────────────────────────────────────── -->
  <header id="main-header">
    <svg class="logo" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="52" height="52" rx="12" fill="#1a6ea8"/>
      <rect x="11" y="11" width="30" height="24" rx="4" stroke="#fff" stroke-width="2.5" fill="none"/>
      <line x1="19" y1="8"  x2="19" y2="16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="33" y1="8"  x2="33" y2="16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="22" x2="37" y2="22" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="19" cy="29" r="1.8" fill="#fff"/>
      <circle cx="26" cy="29" r="1.8" fill="#fff"/>
      <circle cx="33" cy="29" r="1.8" fill="#fff"/>
      <path d="M5 43 Q13 38 21 43 Q29 48 37 43 Q45 38 49 41"
            stroke="rgba(255,255,255,.75)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </svg>
    <h1>Plama <span class="sub">Planning à la marée</span></h1>
  </header>

  <!-- ════════════════════════════════════════════════════════════════
       Écran 1 : Accueil
  ════════════════════════════════════════════════════════════════ -->
  <div id="screen-accueil" class="screen active">
    <div class="card accueil-card">
      <p class="accueil-desc">
        Choisissez un mode pour commencer.
      </p>

      <button id="btn-vers-consulter" class="btn-accueil btn-accent">
        Consulter
        <span class="btn-sub">Visualiser les plages de travail sur une frise</span>
      </button>

      <button id="btn-vers-exporter" class="btn-accueil">
        Exporter
        <span class="btn-sub">Générer un fichier calendrier .ics</span>
      </button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════
       Écran 2 : Exporter (carte + formulaire ICS)
  ════════════════════════════════════════════════════════════════ -->
  <div id="screen-exporter" class="screen">

    <div style="max-width:440px;margin:0 auto;">
      <button class="btn-retour" id="btn-retour-export">&#8592; Retour</button>
    </div>

    <div id="map-ports-export" class="map-ports"></div>

    <div class="card">
      <form id="form-export" novalidate>

        <div class="field">
          <label class="lbl" for="port-select-export">Port</label>
          <select id="port-select-export" required>
            <option value="">Chargement…</option>
          </select>
        </div>

        <div class="row">
          <div class="field">
            <label class="lbl" for="date-debut-export">Date de début</label>
            <input type="date" id="date-debut-export" required>
          </div>
          <div class="field">
            <label class="lbl" for="date-fin-export">Date de fin</label>
            <input type="date" id="date-fin-export" required>
          </div>
        </div>

        <div class="field">
          <label class="lbl" for="seuil-export">Seuil (m CM)</label>
          <input type="text" id="seuil-export" inputmode="decimal"
                 placeholder="ex. 4,5" autocomplete="off" required>
        </div>

        <div class="field">
          <label class="lbl">Mode</label>
          <div class="modes">
            <div class="mode-btn">
              <input type="radio" name="mode-export" id="mode-h-export" value="h" checked>
              <label for="mode-h-export">&#8593; Marée haute</label>
            </div>
            <div class="mode-btn">
              <input type="radio" name="mode-export" id="mode-b-export" value="b">
              <label for="mode-b-export">&#8595; Marée basse</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit">&#128197; Créer le calendrier</button>

        <div id="status-export" class="status-msg" role="alert" aria-live="polite"></div>

      </form>
    </div>

  </div>

  <!-- ════════════════════════════════════════════════════════════════
       Écran 3 : Consulter (carte + formulaire sans date de fin)
  ════════════════════════════════════════════════════════════════ -->
  <div id="screen-consulter" class="screen">

    <div style="max-width:440px;margin:0 auto;">
      <button class="btn-retour" id="btn-retour-consult">&#8592; Retour</button>
    </div>

    <div id="map-ports-consult" class="map-ports"></div>

    <div class="card">
      <form id="form-consult" novalidate>

        <div class="field">
          <label class="lbl" for="port-select-consult">Port</label>
          <select id="port-select-consult" required>
            <option value="">Chargement…</option>
          </select>
        </div>

        <div class="field">
          <label class="lbl" for="date-debut-consult">Date de début</label>
          <input type="date" id="date-debut-consult" required>
        </div>

        <div class="field">
          <label class="lbl" for="seuil-consult">Seuil (m CM)</label>
          <input type="text" id="seuil-consult" inputmode="decimal"
                 placeholder="ex. 4,5" autocomplete="off" required>
        </div>

        <div class="field">
          <label class="lbl">Mode</label>
          <div class="modes">
            <div class="mode-btn">
              <input type="radio" name="mode-consult" id="mode-h-consult" value="h" checked>
              <label for="mode-h-consult">&#8593; Marée haute</label>
            </div>
            <div class="mode-btn">
              <input type="radio" name="mode-consult" id="mode-b-consult" value="b">
              <label for="mode-b-consult">&#8595; Marée basse</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit">&#128065; Afficher</button>

        <div id="status-consult" class="status-msg" role="alert" aria-live="polite"></div>

      </form>
    </div>

  </div>

  <!-- ════════════════════════════════════════════════════════════════
       Écran 4 : Frise de consultation (plein écran)
  ════════════════════════════════════════════════════════════════ -->
  <div id="screen-frise" class="screen">

    <!-- Barre supérieure : retour + informations -->
    <div id="frise-top">
      <button id="btn-retour-frise" aria-label="Retour">&#8592;</button>
      <span id="frise-info"></span>
    </div>

    <!-- Flèches gauche/droite + grille scrollable -->
    <div id="frise-outer">
      <button id="btn-frise-prev" class="frise-nav-btn" aria-label="Semaine précédente">&#8249;</button>

      <div id="frise-scroll">
        <div id="frise-grille">
          <!-- Contenu généré par JS -->
        </div>
      </div>

      <button id="btn-frise-next" class="frise-nav-btn" aria-label="Semaine suivante">&#8250;</button>
    </div>

  </div>

  <!-- ── Pied de page ──────────────────────────────────────────────── -->
  <footer id="main-footer">Fonctionne hors-ligne · Données harmoniques SHOM</footer>

  <!-- Leaflet + moteur de marée + export ICS + application -->
  <script src="js/lib/leaflet.js"></script>
  <script src="js/maree.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
